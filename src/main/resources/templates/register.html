<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: "Manrope", sans-serif;
            background: #f7f1e8;
            color: #1f1a17;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: min(420px, 92vw);
            background: #fff;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.1);
        }
        h1 {
            font-family: "Playfair Display", serif;
            margin: 0 0 16px;
        }
        label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #6c5b4f;
        }
        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 14px;
            font-family: inherit;
        }
        button {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 999px;
            background: #1b5b5a;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .error {
            color: #b00020;
            margin-bottom: 12px;
        }
        .link {
            margin-top: 16px;
            text-align: center;
        }
        .link a {
            color: #1b5b5a;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Create your account</h1>
        <div class="error" th:if="${error}" th:text="${error}"></div>
        <form method="post" th:action="@{/register}" th:object="${registerRequest}">
            <label>Email</label>
            <input type="email" th:field="*{email}" required>

            <label>Password</label>
            <input type="password" th:field="*{password}" required>

            <label>Display Name</label>
            <input type="text" th:field="*{displayName}" required>

            <label>Phone (optional)</label>
            <input type="text" th:field="*{phone}">

            <label>Register As</label>
            <select th:field="*{role}">
                <option value="customer">Customer</option>
                <option value="vendor">Vendor</option>
                <option value="technician">Technician</option>
                <option value="admin">Admin</option>
            </select>

            <button type="submit">Create Account</button>
        </form>
        <div class="link">
            Already have an account? <a href="/login">Login</a>
        </div>
    </div>
</body>
</html>
