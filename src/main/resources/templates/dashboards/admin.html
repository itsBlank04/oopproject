<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: "Manrope", sans-serif; background: #f3f0f7; }
        header { padding: 24px 8vw; background: #4b2b7f; color: #fff; }
        main { padding: 40px 8vw; }
        h1 { font-family: "Playfair Display", serif; margin: 0 0 12px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 16px; }
        .card { background: #fff; padding: 18px; border-radius: 16px; box-shadow: 0 10px 24px rgba(0,0,0,0.08); }
        form { margin-top: 18px; }
        button { padding: 10px 16px; border-radius: 999px; border: none; background: #4b2b7f; color: #fff; font-weight: 600; }
    </style>
</head>
<body>
    <header>
        <h1>Admin Dashboard</h1>
        <p>Monitor trust, fraud alerts, and platform operations.</p>
    </header>
    <main>
        <div class="cards">
            <div class="card">Trust score overview</div>
            <div class="card">Fraud alerts</div>
            <div class="card">Platform revenue</div>
            <div class="card">Inventory signals</div>
        </div>
        <form method="post" th:action="@{/logout}">
            <button type="submit">Logout</button>
        </form>
    </main>
</body>
</html>
