spring.application.name=atomdrops

# ============================================================
# DATABASE: Supabase PostgreSQL
# ============================================================

spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require&pgbouncer=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.servlet.session.tracking-modes=cookie

spring.jpa.open-in-view=false

logging.level.org.hibernate.orm.core=ERROR
logging.level.org.hibernate.orm.jdbc=ERROR

app.cors.allowed-origins=http://localhost:5173,http://localhost:8080
